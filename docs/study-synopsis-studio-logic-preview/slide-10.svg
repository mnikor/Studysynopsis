<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 13.333 7.5">
<rect x="0" y="0" width="13.333" height="7.5" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.012"/>
<rect x="0" y="0" width="0.18" height="7.5" rx="0" fill="#D71920" stroke="#D71920" stroke-width="0.012"/>
<text x="0.63" y="0.54" font-family="Aptos, Arial, sans-serif" font-size="0.09473684210526316" font-weight="700" fill="#D71920" text-anchor="start">STUDY SYNOPSIS STUDIO</text>
<text x="0.63" y="0.9" font-family="Aptos, Arial, sans-serif" font-size="0.25263157894736843" font-weight="400" fill="#242424" text-anchor="start">Final design principle</text>
<text x="0.6599999999999999" y="1.45" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="start">Keep the researcher workflow simple while making the AI more disciplined.</text>
<text x="0.88" y="2.17" font-family="Aptos, Arial, sans-serif" font-size="0.35789473684210527" font-weight="700" fill="#D71920" text-anchor="start">Ask fewer questions upfront.</text>
<text x="5.63" y="2.17" font-family="Aptos, Arial, sans-serif" font-size="0.35789473684210527" font-weight="700" fill="#242424" text-anchor="start">Use the answers to constrain everything downstream.</text>
<line x1="0.85" y1="4.8" x2="12.549999999999999" y2="4.8" stroke="#E5E7EB" stroke-width="0.015"/>
<text x="6.6000000000000005" y="5.47" font-family="Aptos, Arial, sans-serif" font-size="0.18947368421052632" font-weight="400" fill="#475569" text-anchor="middle">The app should feel like a guided study-design assistant, not a protocol template form. Guardrails should appear as feedback, AI prompts, and simplification options at the moment they matter.</text>
</svg>
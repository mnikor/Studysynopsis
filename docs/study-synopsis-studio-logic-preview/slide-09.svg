<text x="6.65" y="6.42" font-family="Aptos, Arial, sans-serif" font-size="0.15789473684210525" font-weight="700" fill="#8A1538" text-anchor="middle">The assessment is not a prediction. It is a design pressure-test that helps users refine intent, comparator, endpoints, and burden.</text>

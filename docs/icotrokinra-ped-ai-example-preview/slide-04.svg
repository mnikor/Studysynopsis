<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 13.333 7.5">
<rect x="0" y="0" width="13.333" height="7.5" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.012"/>
<rect x="0" y="0" width="0.18" height="7.5" rx="0" fill="#D71920" stroke="#D71920" stroke-width="0.012"/>
<text x="0.63" y="0.54" font-family="Aptos, Arial, sans-serif" font-size="0.09473684210526316" font-weight="700" fill="#D71920" text-anchor="start">STUDY SYNOPSIS STUDIO</text>
<text x="0.63" y="0.9" font-family="Aptos, Arial, sans-serif" font-size="0.25263157894736843" font-weight="400" fill="#242424" text-anchor="start">PED-style guardrail check for this example</text>
<text x="0.6599999999999999" y="1.45" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="start">Before AI suggestions are accepted, the app pressure-tests whether the study is becoming too broad.</text>
<rect x="0.72" y="1.7" width="3.55" height="1.32" rx="0.15" fill="#FDECEC" stroke="#D71920" stroke-width="0.012"/>
<text x="1.02" y="2.1" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#D71920" text-anchor="start">Stage fit</text>
<text x="1.02" y="2.47" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">Phase 3/late-stage or post-marketing concept: aligned if safety data are available.</text>
<rect x="4.77" y="1.7" width="3.55" height="1.32" rx="0.15" fill="#FDECEC" stroke="#D71920" stroke-width="0.012"/>
<text x="5.069999999999999" y="2.1" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#D71920" text-anchor="start">Objective count</text>
<text x="5.069999999999999" y="2.47" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">Target ≤5 objectives; avoid splitting every readout into a separate objective.</text>
<rect x="8.82" y="1.7" width="3.55" height="1.32" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="9.120000000000001" y="2.1" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="start">Endpoint focus</text>
<text x="9.120000000000001" y="2.47" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">1 primary endpoint + few key secondary endpoints.</text>
<rect x="0.72" y="3.42" width="3.55" height="1.32" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="1.02" y="3.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="start">Special assessments</text>
<text x="1.02" y="4.1899999999999995" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">PRO/COA only if QoL or symptoms matter to decision use.</text>
<rect x="4.77" y="3.42" width="3.55" height="1.32" rx="0.15" fill="#FDECEC" stroke="#D71920" stroke-width="0.012"/>
<text x="5.069999999999999" y="3.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#D71920" text-anchor="start">PK/PD + biomarkers</text>
<text x="5.069999999999999" y="4.1899999999999995" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">Exclude unless dose, safety, population definition, or stratification requires them.</text>
<rect x="8.82" y="3.42" width="3.55" height="1.32" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="9.120000000000001" y="3.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="start">SoA burden</text>
<text x="9.120000000000001" y="4.1899999999999995" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="start">Only visits and assessments needed for endpoints, safety, and feasibility.</text>
</svg>
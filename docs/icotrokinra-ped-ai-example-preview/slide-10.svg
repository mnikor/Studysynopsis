<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 13.333 7.5">
<rect x="0" y="0" width="13.333" height="7.5" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.012"/>
<rect x="0" y="0" width="0.18" height="7.5" rx="0" fill="#D71920" stroke="#D71920" stroke-width="0.012"/>
<text x="0.63" y="0.54" font-family="Aptos, Arial, sans-serif" font-size="0.09473684210526316" font-weight="700" fill="#D71920" text-anchor="start">STUDY SYNOPSIS STUDIO</text>
<text x="0.63" y="0.9" font-family="Aptos, Arial, sans-serif" font-size="0.25263157894736843" font-weight="400" fill="#242424" text-anchor="start">What the user sees and controls</text>
<text x="0.6599999999999999" y="1.45" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="start">The final workflow stays simple: AI proposes, user selects, guardrails explain what may need tightening.</text>
<rect x="0.75" y="1.75" width="2.2" height="2.45" rx="0.15" fill="#FDECEC" stroke="#D71920" stroke-width="0.012"/>
<text x="1.85" y="2.22" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#D71920" text-anchor="middle">User intent</text>
<text x="1.85" y="2.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="middle">Selects primary aim and study type</text>
<line x1="2.98" y1="2.9699999999999998" x2="3.19" y2="2.9699999999999998" stroke="#8A1538" stroke-width="0.02" marker-end="url(#arrow)"/>
<rect x="3.2" y="1.75" width="2.2" height="2.45" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="4.300000000000001" y="2.22" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="middle">Guardrails</text>
<text x="4.300000000000001" y="2.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="middle">Auto-suggested but overridable</text>
<line x1="5.430000000000001" y1="2.9699999999999998" x2="5.640000000000001" y2="2.9699999999999998" stroke="#8A1538" stroke-width="0.02" marker-end="url(#arrow)"/>
<rect x="5.65" y="1.75" width="2.2" height="2.45" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="6.750000000000001" y="2.22" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="middle">AI proposal</text>
<text x="6.750000000000001" y="2.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="middle">3 alternatives + alignment status</text>
<line x1="7.880000000000001" y1="2.9699999999999998" x2="8.090000000000002" y2="2.9699999999999998" stroke="#8A1538" stroke-width="0.02" marker-end="url(#arrow)"/>
<rect x="8.100000000000001" y="1.75" width="2.2" height="2.45" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="9.200000000000001" y="2.22" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="middle">Selective apply</text>
<text x="9.200000000000001" y="2.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="middle">Accept only chosen objectives/endpoints</text>
<line x1="10.33" y1="2.9699999999999998" x2="10.540000000000001" y2="2.9699999999999998" stroke="#8A1538" stroke-width="0.02" marker-end="url(#arrow)"/>
<rect x="10.55" y="1.75" width="2.2" height="2.45" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="11.65" y="2.22" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#242424" text-anchor="middle">Impact check</text>
<text x="11.65" y="2.8200000000000003" font-family="Aptos, Arial, sans-serif" font-size="0.10526315789473684" font-weight="400" fill="#475569" text-anchor="middle">Scores likely use and flags blockers</text>
<text x="6.65" y="6.02" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#242424" text-anchor="middle">Key behavior: if the user asks for something inconsistent with the intent or PED discipline, AI should push back and propose a safer aligned option rather than blindly comply.</text>
</svg>
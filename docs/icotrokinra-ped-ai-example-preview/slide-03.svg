<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 13.333 7.5">
<rect x="0" y="0" width="13.333" height="7.5" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.012"/>
<rect x="0" y="0" width="0.18" height="7.5" rx="0" fill="#D71920" stroke="#D71920" stroke-width="0.012"/>
<text x="0.63" y="0.54" font-family="Aptos, Arial, sans-serif" font-size="0.09473684210526316" font-weight="700" fill="#D71920" text-anchor="start">STUDY SYNOPSIS STUDIO</text>
<text x="0.63" y="0.9" font-family="Aptos, Arial, sans-serif" font-size="0.25263157894736843" font-weight="400" fill="#242424" text-anchor="start">Primary intent determines the guardrail path</text>
<text x="0.6599999999999999" y="1.45" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="start">The same study can be shaped differently depending on the declared evidentiary destination.</text>
<rect x="0.8" y="1.75" width="3.3" height="1.25" rx="0.15" fill="#E7F5FF" stroke="#1864AB" stroke-width="0.012"/>
<text x="2.45" y="2.27" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#1864AB" text-anchor="middle">Primary aim selected</text>
<line x1="4.2" y1="2.38" x2="5.15" y2="2.38" stroke="#1864AB" stroke-width="0.02666666666666667" marker-end="url(#arrow)"/>
<rect x="5.3" y="1.45" width="3.0" height="1.85" rx="0.15" fill="#FFF7F7" stroke="#D71920" stroke-width="0.012"/>
<text x="6.8" y="1.97" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#D71920" text-anchor="middle">Inform practice / guidelines</text>
<text x="6.8" y="2.6" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="middle">PED-style guardrails</text>
<line x1="8.45" y1="2.38" x2="9.399999999999999" y2="2.38" stroke="#8A1538" stroke-width="0.02666666666666667" marker-end="url(#arrow)"/>
<rect x="9.55" y="1.45" width="2.95" height="1.85" rx="0.15" fill="#FDECEC" stroke="#D71920" stroke-width="0.012"/>
<text x="11.02" y="1.97" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#D71920" text-anchor="middle">Focused clinical evidence</text>
<text x="11.02" y="2.6" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="middle">No endpoint bloat</text>
<rect x="5.3" y="4.0" width="3.0" height="1.35" rx="0.15" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="0.012"/>
<text x="6.8" y="4.5" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#242424" text-anchor="middle">HTA/access intent</text>
<line x1="8.45" y1="4.68" x2="9.399999999999999" y2="4.68" stroke="#475569" stroke-width="0.02666666666666667" marker-end="url(#arrow)"/>
<rect x="9.55" y="3.85" width="2.95" height="1.65" rx="0.15" fill="#E7F5FF" stroke="#1864AB" stroke-width="0.012"/>
<text x="11.02" y="4.35" font-family="Aptos, Arial, sans-serif" font-size="0.17894736842105263" font-weight="700" fill="#1864AB" text-anchor="middle">Lean decision-evidence</text>
<text x="11.02" y="4.97" font-family="Aptos, Arial, sans-serif" font-size="0.12631578947368421" font-weight="400" fill="#475569" text-anchor="middle">QoL/utilization only if useful</text>
<text x="6.699999999999999" y="6.47" font-family="Aptos, Arial, sans-serif" font-size="0.14736842105263157" font-weight="700" fill="#8A1538" text-anchor="middle">For icotrokinra, the app should not write the objective as ‘support HTA’. It should write a testable comparative clinical objective and use HTA/practice intent to shape support endpoints.</text>
</svg>